name: Build and Release

on:
  push:
    tags:
      - 'v*'
  # Manual DRY RUN from any branch: builds, packages and smoke-tests every
  # artifact exactly like a release, but publishes nothing (no image push, no
  # Maven/npm publish, no GitHub Release). Use it to validate pipeline changes
  # before tagging. Every publishing step is gated on a v* tag ref.
  workflow_dispatch:

jobs:
  # Pre-release gate — same suite as per-commit CI (reusable workflow), plus
  # benchmarks. build-* jobs `needs: test`, so a tag never ships untested code.
  test:
    name: Run Tests & Benchmarks
    uses: ./.github/workflows/test.yml
    with:
      benchmarks: true

  build-server:
    name: Build Server Executables
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'

      - name: Build Linux Server
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o ua-server-linux-amd64 ./cmd/server
      
      - name: Build Linux ARM64 Server
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o ua-server-linux-arm64 ./cmd/server
      
      - name: Build Windows Server
        run: |
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o ua-server-windows-amd64.exe ./cmd/server

      - name: Upload Server Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: server-executables
          path: |
            ua-server-linux-amd64
            ua-server-linux-arm64
            ua-server-windows-amd64.exe

  build-shared-libs:
    name: Build Core Libs (Python/Node/Java)
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            goos: linux
            goarch: amd64
            output_lib: libua-parser-linux-amd64.so
          # Native arm64 runner: QEMU-emulated Go builds are known-flaky
          # (golang/go#68976, docker/build-push-action#1309)
          - os: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            output_lib: libua-parser-linux-arm64.so
          - os: windows-2022
            goos: windows
            goarch: amd64
            output_lib: ua-parser-windows-amd64.dll
          # macos-14 runners were retired on 2026-11-02; jobs on them are
          # cancelled before they start.
          - os: macos-15
            goos: darwin
            goarch: "universal"
            output_lib: libua-parser-darwin-arm64.dylib
          # Musl (Alpine) builds
          - os: ubuntu-24.04
            goos: linux
            goarch: amd64
            variant: musl
            output_lib: libua-parser-linux-amd64-musl.so
          - os: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            variant: musl
            output_lib: libua-parser-linux-arm64-musl.so
          # WebAssembly build
          - os: ubuntu-24.04
            goos: wasip1
            goarch: wasm
            output_lib: ua-parser.wasm

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'

      - name: Build Shared Library
        shell: bash
        env:
          CGO_ENABLED: 1
          # buildpack-deps:bullseye multi-arch index (amd64 + arm64).
          BULLSEYE_DIGEST: sha256:30d62be8c0d1960899261429cd3960bccffbd075f324adae967c79f410bde24f
        run: |
          GOROOT_HOST="$(go env GOROOT)"
          go mod download
          if [ "${{ matrix.variant }}" == "musl" ]; then
            echo "Building Linux ${{ matrix.goarch }} (musl/Alpine) in Docker (golang:1.27-alpine) on a native runner..."
            docker run --rm -v "${{ github.workspace }}:/workspace" -w /workspace \
              golang:1.27-alpine sh -c '
                for i in 1 2 3; do apk add --no-cache gcc musl-dev && break || sleep 10; done && \
                CGO_ENABLED=1 go build -buildvcs=false -buildmode=c-shared -ldflags="-s -w" -o ${{ matrix.output_lib }} ./cmd/cshared
              '
          elif [ "${{ matrix.goos }}" == "linux" ]; then
            # glibc 2.31 (Debian 11) keeps the library loadable on older distros.
            # buildpack-deps ships gcc preinstalled, so nothing is installed at
            # build time: Debian 11 left the regular mirrors (apt-get against
            # deb.debian.org now 404s), which broke the v0.0.56 release. The
            # image is pinned by digest so the toolchain cannot drift or vanish
            # behind the tag. Go modules come from the host cache (setup-go).
            echo "Building Linux ${{ matrix.goarch }} in Docker (buildpack-deps:bullseye, glibc 2.31) for broad compatibility, on a native runner..."
            docker run --rm -v "${{ github.workspace }}:/workspace" -v "${GOROOT_HOST}:/usr/local/go:ro" \
              -v "$(go env GOMODCACHE):/root/go/pkg/mod" -w /workspace \
              "buildpack-deps:bullseye@${BULLSEYE_DIGEST}" bash -c '
                export PATH="/usr/local/go/bin:$PATH" && \
                CGO_ENABLED=1 go build -buildvcs=false -buildmode=c-shared -ldflags="-s -w" -o ${{ matrix.output_lib }} ./cmd/cshared && \
                MAX=$(objdump -T ${{ matrix.output_lib }} | grep -o "GLIBC_[0-9.]*" | sort -uV | tail -1) && \
                echo "Highest glibc symbol version required: $MAX" && \
                [ "$(printf "%s\n" "GLIBC_2.31" "$MAX" | sort -V | tail -1)" = "GLIBC_2.31" ]
              '
          elif [ "${{ matrix.goos }}" == "darwin" ]; then
            echo "Building macOS dylibs (arm64 + amd64)..."
            # Do not inherit the runner's own OS version as the minimum:
            # keep the libraries loadable on older macOS releases.
            export MACOSX_DEPLOYMENT_TARGET=12.0
            GOOS=darwin GOARCH=arm64 go build -buildmode=c-shared -ldflags="-s -w" -o libua-parser-darwin-arm64.dylib ./cmd/cshared
            GOOS=darwin GOARCH=amd64 CGO_ENABLED=1 go build -buildmode=c-shared -ldflags="-s -w" -o libua-parser-darwin-amd64.dylib ./cmd/cshared
            for lib in libua-parser-darwin-arm64.dylib libua-parser-darwin-amd64.dylib; do
              echo "$lib minimum macOS: $(otool -l "$lib" | grep -A4 -E 'LC_BUILD_VERSION|LC_VERSION_MIN_MACOSX' | grep -E 'minos|version ' | head -1 | xargs)"
            done
          elif [ "${{ matrix.goos }}" == "wasip1" ]; then
            echo "Building WebAssembly: WASI reactor (Node/Java fallback) + js/wasm (browser)..."
            GOOS=wasip1 GOARCH=wasm go build -buildmode=c-shared -ldflags="-s -w" -o ua-parser.wasm ./cmd/wasm
            GOOS=js GOARCH=wasm go build -ldflags="-s -w" -o ua-parser-js.wasm ./cmd/wasmjs
            cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" wasm_exec.js 2>/dev/null || cp "$(go env GOROOT)/misc/wasm/wasm_exec.js" wasm_exec.js
          else
            LDFLAGS="-s -w"
            if [ "${{ matrix.goos }}" == "windows" ]; then
              LDFLAGS="$LDFLAGS -extldflags=-static"
            fi
            GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -buildmode=c-shared -ldflags="$LDFLAGS" -o ${{ matrix.output_lib }} ./cmd/cshared
          fi

      - name: Upload Shared Library Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: shared-lib-${{ matrix.os }}-${{ matrix.goarch }}${{ matrix.variant == 'musl' && '-musl' || '' }}
          path: |
            ${{ matrix.output_lib }}
            libua-parser-linux-*.so
            libua-parser-darwin-*.dylib
            ua-parser.wasm
            ua-parser-js.wasm
            wasm_exec.js
            *.h
          if-no-files-found: warn

  docker:
    name: Build and Push Docker Image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      
      # Only the final image stage needs emulation (apk add on arm64); the Go
      # build stage runs natively and cross-compiles (see Dockerfile).
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Prepare lowercase image name
        id: prep
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT

      - name: Extract Metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ steps.prep.outputs.image }}
          tags: |
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and Push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  publish-java:
    name: Publish Java Package
    needs: build-shared-libs
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Get Info
        id: info
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER}" >> $GITHUB_OUTPUT
          echo "repo=${GITHUB_REPOSITORY}" >> $GITHUB_OUTPUT
          # Dry runs (workflow_dispatch on a branch) have no version tag.
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then VERSION="${GITHUB_REF_NAME#v}"; else VERSION="0.0.0"; fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Set up JDK 11
        uses: actions/setup-java@v6
        with:
          java-version: '11'
          distribution: 'temurin'
          # Tag builds cannot reuse each other's caches, only the default
          # branch's: the `java` job in ci.yml keeps this one warm on main.
          cache: maven
          cache-dependency-path: clients/java/pom.xml
          server-id: github
          server-username: GITHUB_ACTOR
          # The line below is an env-var NAME resolved by settings.xml, do not change to secrets.GITHUB_TOKEN
          server-password: GITHUB_TOKEN

      - name: Download Shared Libs
        uses: actions/download-artifact@v8
        with:
          pattern: shared-lib-*
          path: clients/java/src/main/resources
          merge-multiple: true

      - name: Clean up and Verify Resources
        run: |
          # DEBUG: Show all downloaded files before moving
          echo "Files downloaded to resources:"
          ls -R clients/java/src/main/resources

          # Remove headers and other non-library files from JAR resources
          rm -f clients/java/src/main/resources/*.h

          # Remove server executables (they don't belong in the client lib)
          rm -f clients/java/src/main/resources/ua-server*

          # Browser artifacts are not used by the Java client (it uses the WASI reactor ua-parser.wasm)
          rm -f clients/java/src/main/resources/ua-parser-js.wasm clients/java/src/main/resources/wasm_exec.js
          
          # Organize into JNA structure
          # Windows
          mkdir -p clients/java/src/main/resources/win32-x86-64
          if [ -f clients/java/src/main/resources/ua-parser-windows-amd64.dll ]; then
              echo "Found Windows lib, moving..."
              mv clients/java/src/main/resources/ua-parser-windows-amd64.dll clients/java/src/main/resources/win32-x86-64/ua-parser.dll
          fi
          
          # Linux x86-64
          mkdir -p clients/java/src/main/resources/linux-x86-64
          if [ -f clients/java/src/main/resources/libua-parser-linux-amd64.so ]; then
              echo "Found Linux x86-64 lib, moving..."
              mv clients/java/src/main/resources/libua-parser-linux-amd64.so clients/java/src/main/resources/linux-x86-64/libua_parser.so
          else
              echo "ERROR: Linux x86-64 lib not found!"
          fi

          # Linux aarch64
          mkdir -p clients/java/src/main/resources/linux-aarch64
          if [ -f clients/java/src/main/resources/libua-parser-linux-arm64.so ]; then
              echo "Found Linux ARM64 lib, moving..."
              mv clients/java/src/main/resources/libua-parser-linux-arm64.so clients/java/src/main/resources/linux-aarch64/libua_parser.so
          fi

          # Linux x86-64 musl (Alpine)
          mkdir -p clients/java/src/main/resources/linux-x86-64-musl
          if [ -f clients/java/src/main/resources/libua-parser-linux-amd64-musl.so ]; then
              echo "Found Linux x86-64 musl lib, moving..."
              mv clients/java/src/main/resources/libua-parser-linux-amd64-musl.so clients/java/src/main/resources/linux-x86-64-musl/libua_parser.so
          else
              echo "ERROR: Linux x86-64 musl lib not found!"
          fi

          # Linux aarch64 musl (Alpine)
          mkdir -p clients/java/src/main/resources/linux-aarch64-musl
          if [ -f clients/java/src/main/resources/libua-parser-linux-arm64-musl.so ]; then
              echo "Found Linux ARM64 musl lib, moving..."
              mv clients/java/src/main/resources/libua-parser-linux-arm64-musl.so clients/java/src/main/resources/linux-aarch64-musl/libua_parser.so
          fi

          # macOS
          mkdir -p clients/java/src/main/resources/darwin-x86-64
          if [ -f clients/java/src/main/resources/libua-parser-darwin-amd64.dylib ]; then
              echo "Found macOS x86-64 lib, moving..."
              mv clients/java/src/main/resources/libua-parser-darwin-amd64.dylib clients/java/src/main/resources/darwin-x86-64/libua-parser.dylib
          fi
          
          mkdir -p clients/java/src/main/resources/darwin-aarch64
          if [ -f clients/java/src/main/resources/libua-parser-darwin-arm64.dylib ]; then
              echo "Found macOS ARM64 lib, moving..."
              mv clients/java/src/main/resources/libua-parser-darwin-arm64.dylib clients/java/src/main/resources/darwin-aarch64/libua-parser.dylib
          fi

          echo "Final resources to be bundled in JAR:"
          ls -R clients/java/src/main/resources

      - name: Verify Required Native Libraries
        run: |
          MISSING_LIBS=()
          
          # Check critical libraries (at least one for each platform)
          [ ! -f clients/java/src/main/resources/win32-x86-64/ua-parser.dll ] && MISSING_LIBS+=("win32-x86-64/ua-parser.dll")
          
          # Linux x86-64
          [ ! -f clients/java/src/main/resources/linux-x86-64/libua_parser.so ] && MISSING_LIBS+=("linux-x86-64/libua_parser.so")
          
          # Linux aarch64
          [ ! -f clients/java/src/main/resources/linux-aarch64/libua_parser.so ] && MISSING_LIBS+=("linux-aarch64/libua_parser.so")
          
          # macOS
          [ ! -f clients/java/src/main/resources/darwin-x86-64/libua-parser.dylib ] && MISSING_LIBS+=("darwin-x86-64/libua-parser.dylib")
          [ ! -f clients/java/src/main/resources/darwin-aarch64/libua-parser.dylib ] && MISSING_LIBS+=("darwin-aarch64/libua-parser.dylib")

          # Linux musl (Alpine)
          [ ! -f clients/java/src/main/resources/linux-x86-64-musl/libua_parser.so ] && MISSING_LIBS+=("linux-x86-64-musl/libua_parser.so")
          [ ! -f clients/java/src/main/resources/linux-aarch64-musl/libua_parser.so ] && MISSING_LIBS+=("linux-aarch64-musl/libua_parser.so")

          # WASM (Critical for this release)
          [ ! -f clients/java/src/main/resources/ua-parser.wasm ] && MISSING_LIBS+=("ua-parser.wasm")
          
          if [ ${#MISSING_LIBS[@]} -ne 0 ]; then
            echo "CRITICAL ERROR: The following required libraries are missing:"
            for lib in "${MISSING_LIBS[@]}"; do
              echo "  - $lib"
            done
            exit 1
          fi
          
          echo "All critical libraries verified successfully."

      - name: Update Maven Version & Group ID
        run: |
          OWNER="${{ steps.info.outputs.owner }}"
          REPO="${{ steps.info.outputs.repo }}"
          VERSION="${{ steps.info.outputs.version }}"
          POM_FILE="clients/java/pom.xml"

          echo "Configuring POM for: $OWNER / $REPO version $VERSION"

          # 1. Update version (using sed for reliability, targeting the placeholder comment)
          sed -i "s|<version>[^<]*</version> <!-- Placeholder, managed by CI -->|<version>$VERSION</version>|g" $POM_FILE

          # 2. Update GroupId (only the project groupId)
          sed -i "s|<groupId>com.github.Octanium91</groupId>|<groupId>com.github.$OWNER</groupId>|g" $POM_FILE

          # 3. Update Repository URL
          sed -i "s|<url>https://maven.pkg.github.com/Octanium91/ua-parser</url>|<url>https://maven.pkg.github.com/$REPO</url>|g" $POM_FILE
          
          echo "Updated POM.xml:"
          cat $POM_FILE

      - name: Build JAR file (runs smoke tests on glibc)
        run: mvn -B package -f clients/java/pom.xml

      - name: Verify the JAR bundles the precompiled WASM engine
        run: |
          # The WASM fallback ships as JVM bytecode generated at build time
          # (pom.xml profile "precompile-wasm"). If the profile silently did
          # not run, Alpine users would get a JAR with no working backend.
          JAR=$(find clients/java/target -maxdepth 1 -name 'ua-parser-*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar')
          unzip -l "$JAR" > jar-contents.txt
          for entry in com/github/octanium91/wasm/UaParserModule.class com/github/octanium91/wasm/UaParserModule.meta; do
            grep -q "$entry" jar-contents.txt || { echo "::error::$entry missing from $JAR"; exit 1; }
          done
          if grep -q 'ua-parser.wasm' jar-contents.txt; then
            echo "::error::raw ua-parser.wasm must not be bundled (it ships precompiled)"; exit 1
          fi
          echo "Precompiled WASM engine present in $JAR"

      - name: Smoke test on Alpine (musl) containers
        run: |
          mvn -B -q dependency:copy-dependencies -f clients/java/pom.xml
          # Both JDK builds users commonly run on Alpine. amazoncorretto also
          # covers arm64 hosts, where temurin has no 17-alpine image.
          for image in eclipse-temurin:17-jre-alpine amazoncorretto:17-alpine; do
            echo "::group::$image"
            docker run --rm -v "${{ github.workspace }}/clients/java:/app" -w /app \
              "$image" \
              java -cp 'target/classes:target/test-classes:target/dependency/*' \
                org.junit.runner.JUnitCore com.github.octanium91.UaParserSmokeTest
            echo "::endgroup::"
          done

      - name: Upload JAR to Release Immediately
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: clients/java/target/*.jar
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Java Artifact
        uses: actions/upload-artifact@v7
        with:
          name: java-jar
          path: clients/java/target/*.jar

      - name: Publish to GitHub Packages
        if: startsWith(github.ref, 'refs/tags/v')
        run: mvn -B deploy -f clients/java/pom.xml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-node:
    name: Publish Node.js Package
    needs: build-shared-libs
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Get Info
        id: info
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_OUTPUT
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then VERSION="${GITHUB_REF_NAME#v}"; else VERSION="0.0.0"; fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@${{ steps.info.outputs.owner }}'

      - name: Download Shared Libs
        uses: actions/download-artifact@v8
        with:
          pattern: shared-lib-*
          path: clients/node/lib/
          merge-multiple: true

      - name: Clean up artifacts
        run: |
          rm -f clients/node/lib/*.h
          rm -f clients/node/lib/ua-server*

      - name: Verify Required Native Libraries
        run: |
          MISSING=()
          [ ! -f clients/node/lib/libua-parser-linux-amd64.so ] && MISSING+=("libua-parser-linux-amd64.so")
          [ ! -f clients/node/lib/libua-parser-linux-arm64.so ] && MISSING+=("libua-parser-linux-arm64.so")
          [ ! -f clients/node/lib/libua-parser-linux-amd64-musl.so ] && MISSING+=("libua-parser-linux-amd64-musl.so")
          [ ! -f clients/node/lib/libua-parser-linux-arm64-musl.so ] && MISSING+=("libua-parser-linux-arm64-musl.so")
          [ ! -f clients/node/lib/ua-parser-windows-amd64.dll ] && MISSING+=("ua-parser-windows-amd64.dll")
          [ ! -f clients/node/lib/libua-parser-darwin-amd64.dylib ] && MISSING+=("libua-parser-darwin-amd64.dylib")
          [ ! -f clients/node/lib/libua-parser-darwin-arm64.dylib ] && MISSING+=("libua-parser-darwin-arm64.dylib")
          [ ! -f clients/node/lib/ua-parser.wasm ] && MISSING+=("ua-parser.wasm")
          [ ! -f clients/node/lib/ua-parser-js.wasm ] && MISSING+=("ua-parser-js.wasm")
          [ ! -f clients/node/lib/wasm_exec.js ] && MISSING+=("wasm_exec.js")
          if [ ${#MISSING[@]} -ne 0 ]; then
            echo "CRITICAL ERROR: missing npm package libraries:"; printf '  - %s\n' "${MISSING[@]}"; exit 1
          fi
          echo "All npm package libraries verified."

      - name: Update Package Metadata
        run: |
          cd clients/node
          OWNER="${{ steps.info.outputs.owner }}"
          VERSION="${{ steps.info.outputs.version }}"

          npm version $VERSION --no-git-tag-version --allow-same-version

          sed -i "s|@uaparser/ua-parser|@$OWNER/ua-parser|g" package.json

          echo "Package prepared: @$OWNER/ua-parser v$VERSION"

      - name: Publish to GitHub Packages
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cd clients/node
          npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # GitHub Packages npm requires a token even for public installs. Attach a
      # plain tarball to the Release so users can install without any token.
      - name: Pack npm tarball
        run: |
          cd clients/node
          npm pack
          ls -1 *.tgz

      - name: Attach npm tarball to Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: clients/node/*.tgz
          token: ${{ secrets.GITHUB_TOKEN }}

  publish-python:
    name: Build Python Wheel
    needs: build-shared-libs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Get Info
        id: info
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then VERSION="${GITHUB_REF_NAME#v}"; else VERSION="0.0.0"; fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install wheel setuptools
      
      - name: Download Shared Libs
        uses: actions/download-artifact@v8
        with:
          pattern: shared-lib-*
          path: clients/python/uaparser/
          merge-multiple: true

      - name: Clean up and Verify Resources
        run: |
          rm -f clients/python/uaparser/*.h
          rm -f clients/python/uaparser/wasm_exec.js
          rm -f clients/python/uaparser/ua-parser.wasm
          rm -f clients/python/uaparser/ua-parser-js.wasm
          rm -f clients/python/uaparser/ua-server*

          MISSING=()
          [ ! -f clients/python/uaparser/libua-parser-linux-amd64.so ] && MISSING+=("libua-parser-linux-amd64.so")
          [ ! -f clients/python/uaparser/libua-parser-linux-arm64.so ] && MISSING+=("libua-parser-linux-arm64.so")
          [ ! -f clients/python/uaparser/libua-parser-linux-amd64-musl.so ] && MISSING+=("libua-parser-linux-amd64-musl.so")
          [ ! -f clients/python/uaparser/libua-parser-linux-arm64-musl.so ] && MISSING+=("libua-parser-linux-arm64-musl.so")
          [ ! -f clients/python/uaparser/ua-parser-windows-amd64.dll ] && MISSING+=("ua-parser-windows-amd64.dll")
          [ ! -f clients/python/uaparser/libua-parser-darwin-amd64.dylib ] && MISSING+=("libua-parser-darwin-amd64.dylib")
          [ ! -f clients/python/uaparser/libua-parser-darwin-arm64.dylib ] && MISSING+=("libua-parser-darwin-arm64.dylib")
          if [ ${#MISSING[@]} -ne 0 ]; then
            echo "CRITICAL ERROR: missing wheel libraries:"; printf '  - %s\n' "${MISSING[@]}"; exit 1
          fi
          echo "All wheel libraries verified."

          ls -R clients/python/uaparser/

      - name: Update Setup.py Version
        run: |
          cd clients/python
          VERSION="${{ steps.info.outputs.version }}"
          sed -i "s|version=\"[^\"]*\",  # Placeholder, managed by CI|version=\"$VERSION\",  # Placeholder, managed by CI|g" setup.py
          echo "Updated setup.py to version $VERSION"

      - name: Build Wheel
        run: |
          cd clients/python
          python setup.py bdist_wheel

      - name: Upload Wheel Artifact
        uses: actions/upload-artifact@v7
        with:
          name: python-wheel
          path: clients/python/dist/*.whl

  release:
    name: Create Release
    needs: [build-server, build-shared-libs, docker, publish-python, publish-java, publish-node]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      
      - name: Prepare lowercase names
        id: prep
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_OUTPUT
          echo "repo=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release-artifacts/ua-server-linux-amd64
            release-artifacts/ua-server-linux-arm64
            release-artifacts/ua-server-windows-amd64.exe
            release-artifacts/libua-parser-linux-amd64.so
            release-artifacts/libua-parser-linux-amd64.h
            release-artifacts/libua-parser-linux-arm64.so
            release-artifacts/libua-parser-linux-arm64.h
            release-artifacts/libua-parser-linux-amd64-musl.so
            release-artifacts/libua-parser-linux-arm64-musl.so
            release-artifacts/ua-parser-windows-amd64.dll
            release-artifacts/ua-parser-windows-amd64.h
            release-artifacts/libua-parser-darwin-amd64.dylib
            release-artifacts/libua-parser-darwin-amd64.h
            release-artifacts/libua-parser-darwin-arm64.dylib
            release-artifacts/libua-parser-darwin-arm64.h
            release-artifacts/ua-parser.wasm
            release-artifacts/ua-parser-js.wasm
            release-artifacts/wasm_exec.js
            release-artifacts/*.whl
            release-artifacts/*.jar
          body: |
            ## Universal User-Agent Parser Release ${{ github.ref_name }}
            
            ### Artifacts Description
            - **ua-server-linux-amd64 / arm64**: Standalone REST API server for Linux.
            - **ua-server-windows-amd64.exe**: Standalone REST API server for Windows.
            - **libua-parser-linux-[arch].so / .h**: Shared library for Linux glibc (amd64, arm64). **Required driver for Python, Node.js, and Java integrations.**
            - **libua-parser-linux-[arch]-musl.so**: Shared library for Linux musl (amd64, arm64). Note: current Go toolchains cannot be dlopen'd on Alpine/musl (golang/go#54805) — on Alpine the Java and Node.js clients automatically use the WebAssembly backend instead; these musl builds ship for forward compatibility.
            - **ua-parser-windows-amd64.dll / .h**: Shared library for Windows. **Required driver for Python, Node.js, and Java integrations.**
            - **libua-parser-darwin-[arch].dylib / .h**: Shared library for macOS (amd64, arm64). **Required driver for Python, Node.js, and Java integrations.**
            - **ua-parser.wasm**: WebAssembly (WASI reactor) module — the automatic fallback engine for the Node.js client (node:wasi) and, precompiled to JVM bytecode inside the JAR, for the Java client (Chicory).
            - **ua-parser-js.wasm / wasm_exec.js**: WebAssembly (js/wasm) module and Go loader for Browser usage.
            - **.whl**: Python wheel for easy installation (includes multi-arch drivers).
            
            ### Package Managers (GitHub Packages)
            - **Java (Maven)**: `com.github.${{ github.repository_owner }}:ua-parser`
            - **Node.js (npm)**: `@${{ steps.prep.outputs.owner }}/ua-parser`
            
            ### Docker Image
            - `docker pull ghcr.io/${{ steps.prep.outputs.repo }}:${{ github.ref_name }}`
          draft: false
          prerelease: false
