name: Test

# Single source of truth for the test suite. Called by ci.yml (per push/PR)
# and by release.yml as the pre-release gate (with benchmarks: true), so the
# steps below never drift between "commit-time" and "release-time" testing.
on:
  workflow_call:
    inputs:
      benchmarks:
        description: "Also run benchmarks (slow; enabled for releases)."
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build all packages
        run: go build ./...

      - name: Build WASM targets
        run: |
          GOOS=wasip1 GOARCH=wasm go build ./cmd/wasm
          GOOS=js GOARCH=wasm go build ./cmd/wasmjs

      - name: Test
        run: go test -count=1 ./...

      - name: Test (race detector)
        # The correction layer swaps an atomic.Pointer rule set under
        # concurrent Parse() calls; -race (cgo, available on the Linux runner)
        # is the gate for that concurrency.
        run: go test -race -count=1 ./pkg/core

      - name: gofmt
        run: |
          out=$(gofmt -l pkg cmd)
          if [ -n "$out" ]; then
            echo "gofmt needed on:" && echo "$out" && exit 1
          fi

      - name: Benchmarks
        if: ${{ inputs.benchmarks }}
        run: go test -bench=. -benchmem ./pkg/core/
