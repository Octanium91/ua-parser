name: Test

# Single source of truth for the test suite. Called by ci.yml (per push/PR)
# and by release.yml as the pre-release gate (with benchmarks: true), so the
# steps below never drift between "commit-time" and "release-time" testing.
on:
  workflow_call:
    inputs:
      benchmarks:
        description: "Also run benchmarks (slow; enabled for releases)."
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # '1.27' = the toolchain releases are built with (go.mod `toolchain`).
        # '1.23' = the minimum Go version library consumers need (go.mod `go`);
        # this job keeps that promise honest. Keep both in sync with go.mod.
        go: ['1.27', '1.23']
    name: test (Go ${{ matrix.go }})
    env:
      # Without this the go.mod `toolchain` line would silently switch the
      # 1.23 job to the newer toolchain and the minimum would go untested.
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}

      - name: Build all packages
        run: go build ./...

      - name: Build WASM targets
        run: |
          # wasip1 reactor needs Go 1.24+ (//go:wasmexport); see cmd/wasm/main.go.
          if [ "${{ matrix.go }}" != "1.23" ]; then
            GOOS=wasip1 GOARCH=wasm go build ./cmd/wasm
          fi
          GOOS=js GOARCH=wasm go build ./cmd/wasmjs

      - name: Test
        run: go test -count=1 ./...

      - name: Test (race detector)
        # The correction layer swaps an atomic.Pointer rule set under
        # concurrent Parse() calls; -race (cgo, available on the Linux runner)
        # is the gate for that concurrency.
        run: go test -race -count=1 ./pkg/core

      - name: gofmt
        run: |
          out=$(gofmt -l pkg cmd)
          if [ -n "$out" ]; then
            echo "gofmt needed on:" && echo "$out" && exit 1
          fi

      - name: Benchmarks
        if: ${{ inputs.benchmarks && matrix.go != '1.23' }}
        run: go test -bench=. -benchmem ./pkg/core/
